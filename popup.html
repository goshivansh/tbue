<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TBUE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 400px;
            background-color: #252525;
            color: #fff;
            padding: 15px;
        }

        .details .heading {
            margin: 8px 0;
        }

        .feature {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 3fr;
            align-items: center;
            padding: 10px;
            text-align: center;
            font-size: 14px;
        }

        .feature:hover {
            background-color: #0000001f;
        }
    </style>
</head>

<body>
    <div class="heading">
        <h1 style="text-align: center;">The Best Utility Extension</h1>
    </div>
    <div class="details">
        <div class="heading">
            <h3>Shortcuts:</h3>
        </div>
        <div class="shortcuts">
            <div class="feature">
                <span class="title">Image PiP:</span>
                <span class="desc">Right Click on Image > <br> Open in PiP Window</span>
            </div>
        </div>
    </div>
</body>

</html>
